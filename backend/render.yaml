services:
  - type: web
    name: brain-tumor-backend
    env: python
    plan: free

    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn backend.app:app --timeout 200 --workers 1 --threads 1"

    envVars:
      - key: PYTHON_VERSION
        value: 3.10

    autoDeploy: true
